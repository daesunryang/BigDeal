name: Android APK

# 데모(UI만)와 정식(실제 차단·로그인·동기화) APK 두 개를 만든다.
# 결과물은 실행 화면의 Artifacts에서 내려받는다. v로 시작하는 태그를 올리면 GitHub 릴리스에 두 APK를 붙인다.
on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '릴리스로 게시할 버전 태그 (예: v1.0.0). 비우면 APK만 만든다.'
        required: false
        default: ''

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npx jest --ci

  apk:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [demo, full]
    env:
      APP_FLAVOR: ${{ matrix.flavor }}
      # 정식 빌드용 Firebase 값 (저장소 Settings → Secrets and variables → Actions). 없으면 이 기기에만 저장되는 모드로 빌드된다.
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ matrix.flavor == 'full' && secrets.FIREBASE_API_KEY || '' }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ matrix.flavor == 'full' && secrets.FIREBASE_AUTH_DOMAIN || '' }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ matrix.flavor == 'full' && secrets.FIREBASE_PROJECT_ID || '' }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ matrix.flavor == 'full' && secrets.FIREBASE_STORAGE_BUCKET || '' }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ matrix.flavor == 'full' && secrets.FIREBASE_MESSAGING_SENDER_ID || '' }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ matrix.flavor == 'full' && secrets.FIREBASE_APP_ID || '' }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ matrix.flavor == 'full' && secrets.GOOGLE_WEB_CLIENT_ID || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate native project
        run: npx expo prebuild --platform android --no-install
      - name: Release signing key (optional)
        # 비밀값 ANDROID_KEYSTORE_BASE64가 있으면 그 키로 서명하고, 없으면 디버그 키로 서명한다 (직접 설치용).
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
          cat >> android/gradle.properties <<PROPS
          JJN_STORE_FILE=release.keystore
          JJN_STORE_PASSWORD=$KEYSTORE_PASSWORD
          JJN_KEY_ALIAS=$KEY_ALIAS
          JJN_KEY_PASSWORD=$KEY_PASSWORD
          PROPS
          node scripts/use-release-signing.js
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Rename
        run: mkdir -p out && cp android/app/build/outputs/apk/release/app-release.apk out/nyangjibjung-${{ matrix.flavor }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nyangjibjung-${{ matrix.flavor }}-apk
          path: out/nyangjibjung-${{ matrix.flavor }}.apk
          if-no-files-found: error

  # 릴리스할 때는 iOS도 따로(macOS) 빌드해서 같은 릴리스에 함께 싣는다
  ios:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    uses: ./.github/workflows/ios.yml
    secrets: inherit
    # 불려 간 iOS 워크플로에도 릴리스 작업(직접 실행용)이 있어 쓰기 권한을 넘겨 줘야 시작할 수 있다
    permissions:
      contents: write

  release:
    needs: [apk, ios]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          cp out/nyangjibjung-demo.apk "out/nyangjibjung-demo-$TAG.apk"
          cp out/nyangjibjung-full.apk "out/nyangjibjung-$TAG.apk"
          for f in nyangjibjung-ios nyangjibjung-ios-demo; do cp "out/$f.ipa" "out/$f-$TAG.ipa"; cp "out/$f-simulator.zip" "out/$f-simulator-$TAG.zip"; done
          gh release create "$TAG" --target "$GITHUB_SHA" --title "냥집중 $TAG" --notes-file docs/release-notes.md \
            "out/nyangjibjung-$TAG.apk#냥집중 Android 정식 (실제 앱 차단 · 로그인 · 동기화)" \
            "out/nyangjibjung-demo-$TAG.apk#냥집중 Android 데모 (UI 데모)" \
            "out/nyangjibjung-ios-$TAG.ipa#냥집중 iOS 정식 (서명 전 · 직접 서명해 설치)" \
            "out/nyangjibjung-ios-demo-$TAG.ipa#냥집중 iOS 데모 (서명 전 · 직접 서명해 설치)" \
            "out/nyangjibjung-ios-simulator-$TAG.zip#냥집중 iOS 정식 · 시뮬레이터용" \
            "out/nyangjibjung-ios-demo-simulator-$TAG.zip#냥집중 iOS 데모 · 시뮬레이터용"
